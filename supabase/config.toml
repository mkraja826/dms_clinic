project_id = "dms"

[functions.send-staff-invite-email]
verify_jwt = true

[functions.send-payment-notification]
# Database Webhooks and scheduled maintenance authenticate with the separate
# PAYMENT_NOTIFICATION_WEBHOOK_SECRET header validated inside the function.
verify_jwt = false

[functions.sync-google-play-subscriptions]
# The pg_cron/pg_net caller authenticates with a separate Vault-held secret.
verify_jwt = false

[functions.connect-card-payment-account]
# Owner/head-doctor authenticated entry point. It returns a one-time Stripe
# Account Link that must be opened in the system browser, never an embedded WebView.
verify_jwt = true

[functions.sync-card-payment-account]
# Owner/head-doctor authenticated status refresh for the clinic's Stripe account.
verify_jwt = true

[functions.create-patient-payment-checkout]
# Reception/owner must be authenticated; the function calls the authoritative
# remaining-balance RPC before creating PhonePe or connected-account card checkout.
verify_jwt = true

[functions.phonepe-patient-payment-webhook]
# PhonePe cannot present a Supabase user JWT. The function authenticates the
# callback itself using PhonePe SHA webhook credentials before touching payment state.
verify_jwt = false

[functions.stripe-patient-payment-webhook]
# Stripe Connect events have no Supabase user JWT. The function validates the
# Stripe-Signature against the server-only endpoint secret before processing them.
verify_jwt = false

[functions.hello-world]
enabled = true
verify_jwt = false
import_map = "./functions/hello-world/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/hello-world/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages from this function:
# static_files = [ "./functions/hello-world/*.html" ]
