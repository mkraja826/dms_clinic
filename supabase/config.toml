project_id = "dms"

[functions.send-staff-invite-email]
verify_jwt = true

[functions.send-payment-notification]
# Database Webhooks and scheduled maintenance authenticate with the separate
# PAYMENT_NOTIFICATION_WEBHOOK_SECRET header validated inside the function.
verify_jwt = false

[functions.sync-google-play-subscriptions]
# The pg_cron/pg_net caller authenticates with a separate Vault-held secret.
verify_jwt = false

[functions.create-patient-payment-checkout]
# Reception/owner must be authenticated; the function then calls the
# server-authoritative prepare RPC before any provider request is created.
verify_jwt = true

[functions.phonepe-patient-payment-webhook]
# PhonePe cannot present a Supabase user JWT. The function authenticates the
# callback itself using PhonePe's configured SHA webhook credentials before it
# reads or mutates any payment request state.
verify_jwt = false

[functions.hello-world]
enabled = true
verify_jwt = false
import_map = "./functions/hello-world/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/hello-world/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages from this function:
# static_files = [ "./functions/hello-world/*.html" ]
