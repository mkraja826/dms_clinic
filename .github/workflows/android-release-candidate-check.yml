name: CapDent V28 release candidate check

on:
  push:
    branches:
      - release/capdent-v28
  pull_request:
    branches:
      - release/capdent-v28
    paths:
      - "src/**"
      - "scripts/validate-capdent-v28-feature.mjs"
      - "scripts/validate-capdent-v28-payments-current.mjs"
      - "scripts/validate-capdent-v28-payment-report-schema.mjs"
      - "scripts/validate-capdent-v28-rc.mjs"
      - "scripts/verify-android-signing.mjs"
      - "app.config.js"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/android-release-candidate-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V28 release candidate
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Run strict V28 RC validation and typecheck
        run: npm run check:v28:rc

      - name: Check repository diff formatting
        run: git diff --check

      - name: Validate Expo public configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rc_validation_only_123456789012345678901234567890123456
        run: npx expo config --type public > /tmp/capdent-v28-expo-config.txt
