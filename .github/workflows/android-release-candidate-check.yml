name: CapDent V26 release candidate check

on:
  push:
    branches:
      - release/capdent-v26
  pull_request:
    paths:
      - "src/**"
      - "scripts/validate-capdent-v26.mjs"
      - "scripts/verify-android-signing.mjs"
      - "app.config.js"
      - "app.json"
      - "eas.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/android-release-candidate-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V26 release candidate
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run strict V26 RC validation and typecheck
        run: npm run check:v26:rc

      - name: Check repository diff formatting
        run: git diff --check

      - name: Validate Expo public configuration
        run: npx expo config --type public > /tmp/capdent-v26-expo-config.txt
