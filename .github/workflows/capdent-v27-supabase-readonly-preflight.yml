name: CapDent V27 Supabase read-only preflight

on:
  push:
    branches:
      - feature/capdent-v27
    paths:
      - .github/workflows/capdent-v27-supabase-readonly-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CAPDENT_SUPABASE_PROJECT_REF: mzjtdcpbvoximdukpukd
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out reviewed V27 branch
        uses: actions/checkout@v4
        with:
          ref: feature/capdent-v27
          fetch-depth: 1

      - name: Verify required GitHub secrets exist
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::GitHub secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::GitHub secret SUPABASE_DB_PASSWORD is not configured."
            exit 1
          fi
          echo "Required Supabase GitHub secrets are present (values intentionally not printed)."

      - name: Install pinned Supabase CLI
        run: npx --yes supabase@2.45.4 --version

      - name: Verify access to CapDent Supabase project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.45.4 projects list | grep -F "${CAPDENT_SUPABASE_PROJECT_REF}"

      - name: Link locally to CapDent project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.45.4 link \
            --project-ref "${CAPDENT_SUPABASE_PROJECT_REF}" \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: List remote migration state (read only)
        run: npx --yes supabase@2.45.4 migration list --linked

      - name: List deployed Edge Functions (read only)
        run: npx --yes supabase@2.45.4 functions list --project-ref "${CAPDENT_SUPABASE_PROJECT_REF}"

      - name: Confirm preflight made no tracked repository changes
        run: git diff --exit-code
