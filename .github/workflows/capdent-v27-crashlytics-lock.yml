name: CapDent V27 Crashlytics lock generator

on:
  push:
    branches:
      - feature/capdent-v27
    paths:
      - .github/workflows/capdent-v27-crashlytics-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V27 feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/capdent-v27
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate exact Crashlytics lock
        run: npm install --package-lock-only --ignore-scripts --save-exact @react-native-firebase/crashlytics@26.2.0

      - name: Validate generated dependency
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies?.['@react-native-firebase/crashlytics']!=='26.2.0') process.exit(1)"
          node -e "const l=require('./package-lock.json'); const p=l.packages?.['node_modules/@react-native-firebase/crashlytics']; if(p?.version!=='26.2.0') process.exit(1)"
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated lock
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No lock changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add Crashlytics dependency lock"
          git push origin HEAD:feature/capdent-v27
