name: CapDent V27 feature check

on:
  push:
    branches:
      - feature/capdent-v27
      - release/capdent-v27
  pull_request:
    branches:
      - release/capdent-v27
    paths:
      - "src/**"
      - "scripts/validate-capdent-v27*.mjs"
      - "scripts/validate-capdent-v26*.mjs"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "docs/capdent-v27-phonepe-sandbox-runbook.md"
      - "app.config.js"
      - "app.json"
      - "eas.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".env.example"
      - ".github/workflows/capdent-v27-feature-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V27 branch with frozen baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: npm ci

      - name: Validate V27 features and typecheck
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "release/capdent-v27" ]; then
            npm run check:v27:rc
          else
            npm run check:v27
          fi

      - name: Typecheck V27 PhonePe Edge Functions
        run: |
          deno check supabase/functions/_shared/phonepeV27.ts
          deno check supabase/functions/phonepe-create-payment/index.ts
          deno check supabase/functions/phonepe-check-payment/index.ts
          deno check supabase/functions/phonepe-callback/index.ts
          deno check supabase/functions/phonepe-return/index.ts

      - name: Check repository diff formatting
        run: git diff --check

      - name: Validate Expo public configuration
        run: npx expo config --type public > /tmp/capdent-v27-expo-config.txt
