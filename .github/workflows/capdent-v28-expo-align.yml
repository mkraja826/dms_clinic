name: CapDent V28 Expo dependency aligner

on:
  push:
    branches:
      - feature/capdent-v28
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/capdent-v28-expo-align.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V28 branch
        uses: actions/checkout@v4
        with:
          ref: feature/capdent-v28

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Align Expo SDK 57 patch versions
        run: npx expo install --fix

      - name: Commit aligned dependency lockfile if needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo dependencies already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Align Expo SDK 57 patch dependencies"
          git push origin HEAD:feature/capdent-v28
